# ==========================================================================
# Kawsah — Netlify deployment configuration
# Static site (Astro). Each route builds to a real HTML file, so there is NO
# SPA catch-all redirect (that would harm SEO). Netlify serves /purchase/ from
# dist/purchase/index.html automatically, and dist/404.html as the 404 page.
# ==========================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security + sensible defaults for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Astro fingerprints hashed assets — safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Forms: submissions are handled automatically when a form in the
# built HTML has the `data-netlify="true"` attribute (see src/config/config.js
# forms.provider = "netlify"). No redirect rule is required here.
